# Runs the private Cluster repo's news pipeline (scripts/pipeline.ts) on a
# public-repo runner (unlimited free minutes). Moved off Vercel 2026-06-12:
# the pipeline was ~12 of the 14.4 Fluid Active CPU hours that got the Hobby
# account paused. Logs here are public — the pipeline prints only step
# counts/timings; secrets are masked by Actions.
name: pipeline

on:
  schedule:
    # Two slots per hour: GitHub's shared cron scheduler drops/drifts runs
    # (5h gap observed 2026-10-15) — doubling the slots roughly doubles the
    # chance each hour actually ingests (and therefore notifies). The
    # concurrency group below keeps overlapping runs from stacking.
    - cron: "7,37 * * * *"
  workflow_dispatch: {}

jobs:
  refresh:
    # Job-level (not workflow-level) so the `chain` job below survives when a
    # newer run supersedes this one's refresh.
    concurrency:
      group: pipeline
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20 # cold run = npm ci (~3m) + AI-paced analyze (~3m) + ingest
    steps:
      - name: Check out private Cluster repo
        uses: actions/checkout@v4
        with:
          repository: Aramide-TechExpert/Cluster
          token: ${{ secrets.CLUSTER_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache node_modules
        id: modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: pipeline-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install deps (cache miss only)
        if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund

      - name: Run pipeline
        env:
          # 738-feed ingest peaks past Node's 4GB default heap (OOM 2026-08-05)
          NODE_OPTIONS: "--max-old-space-size=6144"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Native push (FCM HTTP v1) for the push-breaking / push-fresh steps.
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node --import tsx scripts/pipeline.ts

  # Self-chaining: GitHub's cron scheduler delivers our :07/:37 slots only
  # every 3-5 HOURS in practice (free-tier deprioritization, observed
  # 2026-10-15/16). Each successful run therefore dispatches the next one
  # itself shortly after finishing — cadence ≈ one pipeline duration (~16-22 min),
  # the physical floor for a full ingest+AI cycle.
  # The cron slots remain as restart-insurance if the chain ever breaks
  # (a failed refresh ends the chain on purpose — no failure loops).
  chain:
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only one live chainer: a newer run's chainer replaces a sleeping one.
    concurrency:
      group: pipeline-chain
      cancel-in-progress: true
    steps:
      - name: Sleep, then dispatch the next run
        env:
          GH_TOKEN: ${{ secrets.CLUSTER_TOKEN }}
        run: |
          sleep 15
          gh workflow run pipeline.yml -R Aramide-TechExpert/clustez-pipeline
