# TEMP v4: run the NEW ingest lanes (GDELT domain batches + CNN sitemap)
# from a runner against the real Cluster code. No DB involved. Deleted after.
name: feed-probe
on:
  workflow_dispatch: {}
jobs:
  lanes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Aramide-TechExpert/Cluster
          token: ${{ secrets.CLUSTER_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: node --import tsx scripts/lane_check_tmp.ts
