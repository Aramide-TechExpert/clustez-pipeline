# TEMPORARY: verifies CLUSTER_TOKEN can manage issues in the private Cluster
# repo (alert issues moved there 2026-10-20). Deleted after one green run.
name: issue-test
on:
  workflow_dispatch: {}
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.CLUSTER_TOKEN }}
    steps:
      - run: |
          n=$(gh issue create -R Aramide-TechExpert/Cluster --title "ops-alert access test (auto-closed)" --body "Verifying CLUSTER_TOKEN issue rights; closing immediately." | grep -oE '[0-9]+$')
          gh issue close "$n" -R Aramide-TechExpert/Cluster -c "Access confirmed."
          echo "issue #$n created and closed OK"
