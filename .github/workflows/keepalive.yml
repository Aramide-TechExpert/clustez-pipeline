# Keeps this repository "active" so GitHub never auto-disables the scheduled
# pipeline/daily workflows (they are disabled after 60 days of repo inactivity —
# warning email received 2026-09-29). An empty commit twice a month resets the
# clock for every scheduled workflow here, including this one.
name: keepalive
on:
  schedule:
    - cron: "13 6 1,15 * *"
  workflow_dispatch:
permissions:
  contents: write
# Never run two keepalives at once — a racing pair caused a non-fast-forward
# push rejection on 2026-09-29.
concurrency:
  group: keepalive
  cancel-in-progress: false
jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "clustez-keepalive"
          git config user.email "actions@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive — reset 60-day scheduled-workflow inactivity timer"
          # Rebase-and-retry: another workflow may push between checkout and here.
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase origin main
          done
          echo "keepalive push failed after 3 attempts" >&2
          exit 1
