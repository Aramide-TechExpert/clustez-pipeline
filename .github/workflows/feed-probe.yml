# TEMP v2: probe REPLACEMENT candidates for the Bing-proxied majors from a
# runner IP. Deleted after one run.
name: feed-probe
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe candidates
        run: |
          probe() {
            body=$(curl -s -L --compressed -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36" --max-time 20 "$1")
            items=$(echo "$body" | grep -oc "<item>" || true)
            locs=$(echo "$body" | grep -oc "<loc>" || true)
            echo "PROBE items=$items locs=$locs url=$1"
            echo "$body" | grep -oE "<link>[^<]{0,110}|<loc>[^<]{0,110}" | sed -n '2,3p'
          }
          probe "https://news.google.com/rss/search?q=site:cnn.com&hl=en-US&gl=US&ceid=US:en"
          probe "https://news.google.com/rss/search?q=site:reuters.com&hl=en-US&gl=US&ceid=US:en"
          probe "https://www.cnn.com/sitemap/news.xml"
          probe "https://apnews.com/news-sitemap-content.xml"
          probe "https://www.reuters.com/arc/outboundfeeds/news-sitemap-index/?outputType=xml"
          probe "https://www.washingtonpost.com/sitemaps/news.xml"
