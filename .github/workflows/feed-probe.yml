# TEMP v8: full-roster news-sitemap discovery. For each domain: read
# robots.txt, pick the best news-looking sitemap, fetch it (following one
# index level), report OK lines with loc counts. Deleted after one run.
name: feed-probe
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Discover
        run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36"
          fetch() { curl -s -L --compressed -A "$UA" --max-time 10 "$1"; }
          count_news() { grep -oc "news:title" <<< "$1"; }
          while read -r d; do
            robots=$(fetch "https://$d/robots.txt")
            cand=$(grep -ioE "^sitemap: *\S+" <<< "$robots" | awk '{print $2}' | grep -iE "news|google" | head -1)
            [ -z "$cand" ] && cand=$(grep -ioE "^sitemap: *\S+" <<< "$robots" | awk '{print $2}' | head -1)
            [ -z "$cand" ] && { echo "MISS $d no-sitemap"; continue; }
            body=$(fetch "$cand")
            if grep -q "<sitemapindex" <<< "$body"; then
              child=$(grep -oE "<loc>[^<]+" <<< "$body" | sed 's/<loc>//' | grep -iE "news|google" | head -1)
              [ -z "$child" ] && child=$(grep -oE "<loc>[^<]+" <<< "$body" | sed 's/<loc>//' | head -1)
              [ -n "$child" ] && { cand="$child"; body=$(fetch "$cand"); }
            fi
            n=$(count_news "$body"); locs=$(grep -oc "<loc>" <<< "$body")
            if [ "${n:-0}" -ge 5 ]; then echo "OK $d $cand news=$n"
            else echo "MISS $d cand=$cand locs=$locs news=$n"; fi
          done < domains.txt
